[project]
name = "agentkit"
version = "0.1.0"
description = "Standards, notes and subagent reviews, shared across machines and agents"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "rich>=13"]

[project.urls]
Repository = "https://github.com/Ocramaru/.agents"   # where `agent issue` drafts from an install, which has no git remote

[project.scripts]
agent = "agentkit.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

# What the hub reads beside its code, laid out as in the repo under the package, where hub.BUNDLED finds it.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "agentkit/bundled/AGENTS.md"
"agents" = "agentkit/bundled/agents"
"commands" = "agentkit/bundled/commands"
"config.toml" = "agentkit/bundled/config.toml"
"githooks" = "agentkit/bundled/githooks"
"hooks" = "agentkit/bundled/hooks"
"settings.hooks.json" = "agentkit/bundled/settings.hooks.json"
"standards" = "agentkit/bundled/standards"
"templates" = "agentkit/bundled/templates"

[tool.uv]
package = true           # a checkout's venv holds agentkit editable, so its `agent` runs its own code

[tool.ruff]
indent-width = 2
line-length = 120        # a ceiling for the linter, not a target; long where long reads better

[tool.ruff.lint]
# E501 stays unselected so length is never enforced, and E701 is ignored because the one-line
# `if`s in agentkit are deliberate. See standards/python.md, which this file encodes.
#
# RUF022 sorts __all__ one name per line, which threw away the grouping by source module that
# was the point of the layout -- a formatter's job done by a lint rule, so `--fix` would do it.
#
# I001 is the same: it re-explodes a parenthesized import to one module per line, which is 17 lines
# for cli.py's 15 imports. Sorting is worth keeping by hand; the wrapping is not the linter's call.
ignore = ["E701", "E702", "E741", "RUF022", "I001"]
